# Meridian — standalone VPS deploy (Hong Kong). LIVE config.
#
# Split into two containers so the dashboard can redeploy WITHOUT restarting the
# trading daemon (zero-downtime web deploys):
#
#   meridian      = the trading daemon. Owns the network namespace + the bridge
#                   on 127.0.0.1:8787 + the state volume. Restarts only when
#                   daemon/core code changes.
#   meridian-web  = the Next.js dashboard. Shares the daemon's netns
#                   (network_mode: service:meridian) so it can reach the
#                   localhost-only bridge. Recreated on every web change; the
#                   daemon keeps trading.
#   cloudflared   = Cloudflare Tunnel → http://meridian:3000 (the web listens
#                   there, inside the shared namespace). Behind CF Access + PIN.
#
# Both app containers run the SAME image, selecting one PM2 app via --only.
# Image comes from GHCR in CI-driven deploys; `build: .` covers local builds.
networks:
  mnet:
    driver: bridge

services:
  meridian:
    build: .
    image: ${MERIDIAN_IMAGE:-ghcr.io/umarmuhdhor/meridian:dashboard}
    container_name: meridian
    restart: unless-stopped
    command: ["pm2-runtime", "ecosystem.config.cjs", "--only", "meridian"]
    env_file: .env
    environment:
      - MERIDIAN_STATE_DIR=/opt/data
      - MERIDIAN_ROOT=/opt/data
      - DASHBOARD_ENABLED=true
      - MERIDIAN_AUTONOMOUS=true
      - NODE_ENV=production
      - MERIDIAN_CHAIN=meteora
      - MERIDIAN_MARKET=real
      - MERIDIAN_PRICE=jupiter
    volumes:
      - /home/ubuntu/meridian-data:/opt/data
      - /home/ubuntu/meridian/user-config.json:/app/user-config.json
    ports:
      # Loopback-only, for SSH-tunnel admin. Public access is via cloudflared.
      - "127.0.0.1:3000:3000"
    networks: [mnet]

  meridian-web:
    image: ${MERIDIAN_IMAGE:-ghcr.io/umarmuhdhor/meridian:dashboard}
    container_name: meridian-web
    restart: unless-stopped
    command: ["pm2-runtime", "ecosystem.config.cjs", "--only", "meridian-web"]
    env_file: .env
    environment:
      - MERIDIAN_ROOT=/opt/data
      - NODE_ENV=production
    volumes:
      - /home/ubuntu/meridian-data:/opt/data
      # The daemon keeps its live config at cwd (/app/user-config.json), NOT in
      # the state volume — so MERIDIAN_ROOT=/opt/data can't see it and the Config
      # page renders blank. Mount the SAME host file the daemon uses (read-only;
      # dashboard edits write back via the bridge → daemon, not this path).
      - /home/ubuntu/meridian/user-config.json:/opt/data/user-config.json:ro
    # Share the daemon's network namespace so the dashboard reaches the
    # localhost-only bridge (127.0.0.1:8787) and listens on :3000 there.
    network_mode: "service:meridian"
    depends_on:
      - meridian

  # Sidecar for the Sage↔Meridian Path-2 transport: exposes the daemon's
  # loopback-only bridge (127.0.0.1:8787) on :8788 inside the meridian netns so
  # the cloudflared tunnel (mrd-bridge.nafidinara.com) can reach it. Shares
  # meridian's netns via compose so `up -d --force-recreate` re-attaches it on
  # every deploy (a standalone `--network container:meridian` orphans on recreate).
  bridge-proxy:
    image: alpine/socat
    container_name: meridian-bridge-proxy
    restart: unless-stopped
    network_mode: "service:meridian"
    depends_on:
      - meridian
    command: tcp-listen:8788,fork,reuseaddr tcp-connect:127.0.0.1:8787

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: meridian-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - meridian
    networks: [mnet]

