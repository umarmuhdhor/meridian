# Meridian — production stack for the vivobook home server.
#
# Two containers, same image (GHCR), split so a dashboard redeploy does NOT
# restart the trading daemon (zero-downtime web deploys):
#
#   meridian      = trading daemon. Owns the netns + control bridge on
#                   127.0.0.1:8787 + the state volume. Restarts only when
#                   daemon/core code changes.
#   meridian-web  = Next.js dashboard. Shares meridian's netns
#                   (network_mode: service:meridian) so it can reach the
#                   localhost-only bridge and be reverse-proxied by the
#                   host's existing Caddy on the "web" network.
#
# Public exposure: the vivobook's existing cloudflared connector forwards
# calisto.nafidinara.com → http://caddy → http://meridian:3000 (via Host
# header, Caddyfile entry lives on the host, NOT in this repo). Behind
# Cloudflare Access + app PIN.
#
# Sage (Hermes agent) delegation goes intra-host via docker's host-gateway,
# to sage-api-proxy (socat) at 127.0.0.1:8643 on the host, which forwards
# to the hermes gateway at 127.0.0.1:8642. Configured via `extra_hosts` and
# SAGE_BASE_URL=http://host.docker.internal:8643 in .env. No CF Access
# needed on this path; no meridian-bridge-proxy sidecar needed.
#
# CI-driven deploys use GHCR-pushed images; `build: .` supports local rebuild.
networks:
  web:
    external: true
    name: web

services:
  meridian:
    build: .
    image: ${MERIDIAN_IMAGE:-ghcr.io/umarmuhdhor/meridian:dashboard}
    container_name: meridian
    restart: unless-stopped
    command: ["pm2-runtime", "ecosystem.config.cjs", "--only", "meridian"]
    env_file: .env
    environment:
      - MERIDIAN_STATE_DIR=/opt/data
      - MERIDIAN_ROOT=/opt/data
      - DASHBOARD_ENABLED=true
      - MERIDIAN_AUTONOMOUS=true
      - NODE_ENV=production
      - MERIDIAN_CHAIN=meteora
      - MERIDIAN_MARKET=real
      - MERIDIAN_PRICE=jupiter
    volumes:
      - ${HOME}/meridian-data:/opt/data
      - ${HOME}/meridian/user-config.json:/app/user-config.json
    # host-gateway resolves host.docker.internal to the docker0 bridge IP so
    # SAGE_BASE_URL=http://host.docker.internal:8643 hits sage-api-proxy (socat
    # on the host, network_mode: host) → 127.0.0.1:8642 (hermes gateway).
    # Requires Docker Engine >= 20.10.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Dashboard :3000 is NOT host-bound (vivobook's :3000 is taken; Caddy on
    # `web` net serves calisto.nafidinara.com → meridian:3000 by container DNS).
    # But :8788 IS host-bound so the Sage (Hermes) plugin, which runs in a
    # `network_mode: host` container, can reach the bridge via
    # http://127.0.0.1:8788 → socat sidecar → meridian bridge 127.0.0.1:8787.
    # NOTE: port bindings for services sharing this netns (bridge-proxy) MUST
    # be declared here on the owning service, not on the sidecar.
    ports:
      - "127.0.0.1:8788:8788"
    networks: [web]

  meridian-web:
    image: ${MERIDIAN_IMAGE:-ghcr.io/umarmuhdhor/meridian:dashboard}
    container_name: meridian-web
    restart: unless-stopped
    command: ["pm2-runtime", "ecosystem.config.cjs", "--only", "meridian-web"]
    env_file: .env
    environment:
      - MERIDIAN_ROOT=/opt/data
      - NODE_ENV=production
    volumes:
      - ${HOME}/meridian-data:/opt/data
      # The daemon keeps its live config at cwd (/app/user-config.json), NOT
      # in the state volume. Mount the SAME host file the daemon uses so the
      # dashboard's Config page can read it (read-only; edits go via the
      # bridge → daemon, not this path).
      - ${HOME}/meridian/user-config.json:/opt/data/user-config.json:ro
    # Share the daemon's netns → dashboard reaches localhost-only bridge at
    # 127.0.0.1:8787 and listens on :3000 there. Also inherits extra_hosts.
    network_mode: "service:meridian"
    depends_on:
      - meridian

  # Sidecar exposing the Meridian dashboard bridge (127.0.0.1:8787 inside
  # meridian's netns) to the vivobook host on 127.0.0.1:8788, so the Sage
  # (Hermes) plugin can call mrd_deploy_position/close_position/etc via
  # MERIDIAN_BRIDGE_URL=http://127.0.0.1:8788. `hermes` runs `network_mode: host`
  # so it reaches the host loopback directly. Shares meridian's netns so
  # `docker compose up -d --force-recreate meridian` re-attaches it every
  # deploy (standalone `--network container:meridian` orphans on recreate).
  bridge-proxy:
    image: alpine/socat
    container_name: meridian-bridge-proxy
    restart: unless-stopped
    network_mode: "service:meridian"
    depends_on:
      - meridian
    command: tcp-listen:8788,fork,reuseaddr tcp-connect:127.0.0.1:8787
