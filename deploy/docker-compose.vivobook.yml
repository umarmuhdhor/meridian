# Meridian on the vivobook. One container: PM2 runs the trading daemon + the
# Next.js dashboard. Joins the existing external "web" network so the box's
# Caddy reverse-proxies the dashboard by Host header (Cloudflare Tunnel edge).
#
# Usage:
#   docker compose up -d --build
#   docker compose logs -f
#
# Secrets come from .env (env_file). The dashboard is NEVER published on the
# host/LAN — Caddy on the "web" network reaches it as http://meridian:3000.
networks:
  web:
    external: true
    name: web

services:
  meridian:
    build: .
    image: meridian
    container_name: meridian
    restart: unless-stopped
    env_file: .env
    environment:
      # State + logs on the persistent volume, shared by daemon (writer) and
      # web (reader). Must match the volume mount below.
      - MERIDIAN_STATE_DIR=/opt/data
      - MERIDIAN_ROOT=/opt/data
      # Turn the localhost bridge on so the dashboard can reach the daemon.
      - DASHBOARD_ENABLED=true
      - MERIDIAN_AUTONOMOUS=true
      - NODE_ENV=production
    volumes:
      - ${HOME}/meridian-data:/opt/data
    networks: [web]
