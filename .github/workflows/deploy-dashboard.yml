name: deploy-dashboard

# Auto-deploy on every push to `dashboard`:
#   test-build (ubuntu-latest) → deploy (self-hosted vivobook runner)
# A failed test/build never reaches the box; an unhealthy release auto-rolls
# back on the box. The daemon restarts only when non-web code changed.
on:
  push:
    branches: [dashboard]

# Serialize deploys so two pushes never race the box. Do NOT cancel a deploy
# already talking to the runtime — queue behind it.
concurrency:
  group: deploy-dashboard
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  test-build:
    runs-on: ubuntu-latest
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history — github.event.before can be >2 commits back (merges)

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # ── gate 1: daemon tests (typecheck + vitest) ──
      - name: Install daemon deps
        run: npm ci
      - name: Daemon tests
        run: npm test

      # ── gate 2: web tests + build must compile ──
      - name: Install web deps
        working-directory: dashboard/web
        run: npm ci
      - name: Web tests
        working-directory: dashboard/web
        run: npm test
      - name: Web build (compile check)
        working-directory: dashboard/web
        run: npm run build

      # ── decide restart scope from changed paths ──
      # web-only  → nothing outside dashboard/web/ changed → hot-swap web
      # full      → daemon/core/infra changed → recreate daemon too
      # none      → docs/workflow only → skip build+deploy entirely
      - name: Determine deploy scope
        id: scope
        env:
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "scope=full" >> "$GITHUB_OUTPUT"; echo "first/forced push → full"; exit 0
          fi
          CHANGED=$(git diff --name-only "$BEFORE" "$SHA")
          echo "changed files:"; echo "$CHANGED"
          if [ -z "$CHANGED" ] || ! echo "$CHANGED" | grep -qvE '(\.md$|^\.github/)'; then
            echo "scope=none" >> "$GITHUB_OUTPUT"; echo "→ non-runtime change, skip build+deploy"
          elif echo "$CHANGED" | grep -qvE '^dashboard/web/'; then
            echo "scope=full" >> "$GITHUB_OUTPUT"; echo "→ full (non-web change)"
          else
            echo "scope=web-only" >> "$GITHUB_OUTPUT"; echo "→ web-only"
          fi

      # ── build + push the (now tested) image (skipped on docs-only pushes) ──
      # setup-buildx provides the docker-container driver required for the
      # type=gha build cache below.
      - if: steps.scope.outputs.scope != 'none'
        uses: docker/setup-buildx-action@v3
      - if: steps.scope.outputs.scope != 'none'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.scope.outputs.scope != 'none'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/umarmuhdhor/meridian:${{ github.sha }}
            ghcr.io/umarmuhdhor/meridian:dashboard
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: test-build
    if: |
      needs.test-build.outputs.scope != 'none' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/dashboard'
    # Vivobook home server, docker group, GHCR-authenticated.
    runs-on: [self-hosted, vivobook]
    env:
      SHA: ${{ github.sha }}
      SCOPE: ${{ needs.test-build.outputs.scope }}
    steps:
      - uses: actions/checkout@v4

      # Sync the compose + deploy.sh into the runtime dir the daemon uses.
      # ~/meridian is the durable config dir (holds .env, user-config.json,
      # meridian-data volume mount). $GITHUB_WORKSPACE is per-job.
      - name: Sync infra to runtime dir
        run: |
          set -euo pipefail
          mkdir -p "$HOME/meridian/deploy"
          cp "$GITHUB_WORKSPACE/docker-compose.yml" "$HOME/meridian/"
          cp "$GITHUB_WORKSPACE/deploy/deploy.sh"   "$HOME/meridian/deploy/"
          chmod +x "$HOME/meridian/deploy/deploy.sh"

      - name: Deploy (scoped cutover → health-check → auto-rollback)
        run: |
          set -euo pipefail
          cd "$HOME/meridian"
          ./deploy/deploy.sh "$SHA" "$SCOPE"
