name: deploy-dashboard

# Auto-deploy on every push to `dashboard`:
#   test-build (ubuntu-latest) → deploy (ubuntu-latest via CF Access SSH to vivobook)
# A failed test/build never reaches the box; an unhealthy release auto-rolls
# back on the box. The daemon restarts only when non-web code changed.
#
# CF Access SSH: vivobook has zero open inbound ports. `ssh vivobook-public`
# tunnels through Cloudflare Access via `cloudflared access ssh --hostname %h`,
# authenticated with a service token whose ID + secret live in GH secrets
# (CF_ACCESS_CLIENT_ID, CF_ACCESS_CLIENT_SECRET). Deploy keypair private half
# lives in VIVOBOOK_SSH_KEY; pub half is in vivobook's ~/.ssh/authorized_keys.
on:
  push:
    branches: [dashboard]

# Serialize deploys so two pushes never race the box.
concurrency:
  group: deploy-dashboard
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  test-build:
    runs-on: ubuntu-latest
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history — github.event.before can be >2 commits back (merges)

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # ── gate 1: daemon tests (typecheck + vitest) ──
      - name: Install daemon deps
        run: npm ci
      - name: Daemon tests
        run: npm test

      # ── gate 2: web tests + build must compile ──
      - name: Install web deps
        working-directory: dashboard/web
        run: npm ci
      - name: Web tests
        working-directory: dashboard/web
        run: npm test
      - name: Web build (compile check)
        working-directory: dashboard/web
        run: npm run build

      # ── decide restart scope from changed paths ──
      - name: Determine deploy scope
        id: scope
        env:
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "scope=full" >> "$GITHUB_OUTPUT"; echo "first/forced push → full"; exit 0
          fi
          CHANGED=$(git diff --name-only "$BEFORE" "$SHA")
          echo "changed files:"; echo "$CHANGED"
          if [ -z "$CHANGED" ] || ! echo "$CHANGED" | grep -qvE '(\.md$|^\.github/)'; then
            echo "scope=none" >> "$GITHUB_OUTPUT"; echo "→ non-runtime change, skip build+deploy"
          elif echo "$CHANGED" | grep -qvE '^dashboard/web/'; then
            echo "scope=full" >> "$GITHUB_OUTPUT"; echo "→ full (non-web change)"
          else
            echo "scope=web-only" >> "$GITHUB_OUTPUT"; echo "→ web-only"
          fi

      # ── build + push the (now tested) image (skipped on docs-only pushes) ──
      - if: steps.scope.outputs.scope != 'none'
        uses: docker/setup-buildx-action@v3
      - if: steps.scope.outputs.scope != 'none'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.scope.outputs.scope != 'none'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/umarmuhdhor/meridian:${{ github.sha }}
            ghcr.io/umarmuhdhor/meridian:dashboard
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: test-build
    if: |
      needs.test-build.outputs.scope != 'none' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/dashboard'
    runs-on: ubuntu-latest
    # cloudflared reads these from env for service-token auth on `access ssh`.
    env:
      CF_ACCESS_CLIENT_ID:     ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      SHA:   ${{ github.sha }}
      SCOPE: ${{ needs.test-build.outputs.scope }}
    steps:
      - uses: actions/checkout@v4

      - name: Install cloudflared
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/cloudflared \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          sudo install -m 0755 /tmp/cloudflared /usr/local/bin/cloudflared
          cloudflared --version

      - name: Configure SSH via CF Access ProxyCommand
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          # Deploy key (private half; pub half is in vivobook ~/.ssh/authorized_keys)
          printf '%s\n' "${{ secrets.VIVOBOOK_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          cat > ~/.ssh/config <<'SSHCFG'
          Host vivobook
            HostName ssh.nafidinara.com
            User nafidinara
            IdentityFile ~/.ssh/id_ed25519
            IdentitiesOnly yes
            ProxyCommand /usr/local/bin/cloudflared access ssh --hostname %h
            StrictHostKeyChecking accept-new
            UserKnownHostsFile ~/.ssh/known_hosts
            ServerAliveInterval 15
            ServerAliveCountMax 8
          SSHCFG
          chmod 600 ~/.ssh/config

      - name: SSH connectivity smoke test
        run: ssh -o BatchMode=yes vivobook 'echo SSH_OK from $(hostname) as $(whoami); docker version --format "docker {{.Server.Version}}"'

      - name: Sync infra to runtime dir on vivobook
        run: |
          set -euo pipefail
          # deploy.sh reads $HOME/meridian by default; ensure the dir exists.
          ssh vivobook 'mkdir -p ~/meridian/deploy'
          scp -o BatchMode=yes docker-compose.yml vivobook:~/meridian/docker-compose.yml
          scp -o BatchMode=yes deploy/deploy.sh   vivobook:~/meridian/deploy/deploy.sh
          ssh vivobook 'chmod +x ~/meridian/deploy/deploy.sh'

      - name: Deploy (scoped cutover → health-check → auto-rollback)
        run: |
          ssh vivobook "cd ~/meridian && ./deploy/deploy.sh '$SHA' '$SCOPE'"
